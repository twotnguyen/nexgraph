<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#192252" />
      <stop offset="45%" stop-color="#12183a" />
      <stop offset="100%" stop-color="#080c1e" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#7a4df2" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#3257f0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7a4df2" stop-opacity="0.36" />
      <stop offset="40%" stop-color="#3257f0" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#12183a" stop-opacity="0" />
    </radialGradient>

    <!-- Edge Gradients -->
    <linearGradient id="nPathGlow" x1="148" y1="364" x2="364" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a9c99" />
      <stop offset="25%" stop-color="#3257f0" />
      <stop offset="50%" stop-color="#7a4df2" />
      <stop offset="75%" stop-color="#e23d94" />
      <stop offset="100%" stop-color="#e0a100" />
    </linearGradient>

    <linearGradient id="leftPillar" x1="148" y1="364" x2="148" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a9c99" />
      <stop offset="100%" stop-color="#3257f0" />
    </linearGradient>

    <linearGradient id="diagBridge" x1="148" y1="148" x2="364" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3257f0" />
      <stop offset="50%" stop-color="#7a4df2" />
      <stop offset="100%" stop-color="#e23d94" />
    </linearGradient>

    <linearGradient id="rightPillar" x1="364" y1="364" x2="364" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e23d94" />
      <stop offset="100%" stop-color="#e0a100" />
    </linearGradient>

    <linearGradient id="topRoofLeft" x1="148" y1="148" x2="256" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3257f0" />
      <stop offset="100%" stop-color="#7a4df2" />
    </linearGradient>

    <linearGradient id="topRoofRight" x1="256" y1="92" x2="364" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7a4df2" />
      <stop offset="100%" stop-color="#e0a100" />
    </linearGradient>

    <linearGradient id="bottomFloorLeft" x1="148" y1="364" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a9c99" />
      <stop offset="100%" stop-color="#1c9a5b" />
    </linearGradient>

    <linearGradient id="bottomFloorRight" x1="256" y1="420" x2="364" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c9a5b" />
      <stop offset="100%" stop-color="#e23d94" />
    </linearGradient>

    <!-- Node Radial Gradients -->
    <radialGradient id="nodeBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7aa3ff" />
      <stop offset="50%" stop-color="#3257f0" />
      <stop offset="100%" stop-color="#1a35a0" />
    </radialGradient>

    <radialGradient id="nodeTeal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3fe0dd" />
      <stop offset="50%" stop-color="#0a9c99" />
      <stop offset="100%" stop-color="#065f5d" />
    </radialGradient>

    <radialGradient id="nodeMagenta" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7ebc" />
      <stop offset="50%" stop-color="#e23d94" />
      <stop offset="100%" stop-color="#931358" />
    </radialGradient>

    <radialGradient id="nodeAmber" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffde59" />
      <stop offset="50%" stop-color="#e0a100" />
      <stop offset="100%" stop-color="#8a5e00" />
    </radialGradient>

    <radialGradient id="nodeViolet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d4adfc" />
      <stop offset="50%" stop-color="#7a4df2" />
      <stop offset="100%" stop-color="#4a22aa" />
    </radialGradient>

    <radialGradient id="nodeGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4fe391" />
      <stop offset="50%" stop-color="#1c9a5b" />
      <stop offset="100%" stop-color="#0d5731" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="bloomGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- 2. Ambient Lighting -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)" />

  <!-- 3. Micro Background Mesh (Graph Topology) -->
  <g opacity="0.14" stroke="#a9b3e6" stroke-width="1.5" stroke-dasharray="3,3">
    <!-- Outer Octagon / Hypergraph bounding mesh -->
    <line x1="256" y1="92" x2="256" y2="256" />
    <line x1="256" y1="256" x2="256" y2="420" />
    <line x1="148" y1="148" x2="148" y2="364" />
    <line x1="364" y1="148" x2="364" y2="364" />
  </g>

  <!-- 4. Secondary Hypergraph Dimensional Edges (Top Roof & Bottom Floor) -->
  <g stroke-linecap="round" opacity="0.6">
    <!-- Top roof connecting Architecture -> AI/Insight Satellite -> Knowledge -->
    <line x1="148" y1="148" x2="256" y2="92" stroke="url(#topRoofLeft)" stroke-width="4.5" />
    <line x1="256" y1="92" x2="364" y2="148" stroke="url(#topRoofRight)" stroke-width="4.5" />
    
    <!-- Bottom floor connecting Code -> Test/Verified Satellite -> Impact -->
    <line x1="148" y1="364" x2="256" y2="420" stroke="url(#bottomFloorLeft)" stroke-width="4.5" stroke-dasharray="8,5" />
    <line x1="256" y1="420" x2="364" y2="364" stroke="url(#bottomFloorRight)" stroke-width="4.5" stroke-dasharray="8,5" />
  </g>

  <!-- 5. Primary Graph Edges forming the Capital 'N' (The Nexus Backbone) -->
  <!-- Outer Glow Stroke for the 'N' -->
  <path d="M 148 364 L 148 148 L 364 364 L 364 148" fill="none" stroke="url(#nPathGlow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.32" filter="url(#bloomGlow)" />

  <!-- Main Solid Connecting Stems -->
  <!-- Left Pillar: Code -> Architecture -->
  <line x1="148" y1="364" x2="148" y2="148" stroke="url(#leftPillar)" stroke-width="15" stroke-linecap="round" />

  <!-- The Nexus Diagonal Bridge: Architecture -> Central Hub -> Flow/Impact -->
  <line x1="148" y1="148" x2="364" y2="364" stroke="url(#diagBridge)" stroke-width="17" stroke-linecap="round" />

  <!-- Right Pillar: Impact -> Knowledge/Output -->
  <line x1="364" y1="364" x2="364" y2="148" stroke="url(#rightPillar)" stroke-width="15" stroke-linecap="round" />

  <!-- Evidence Pulse Dots on the Flow Highway -->
  <circle cx="206" cy="206" r="4.5" fill="#ffffff" opacity="0.9" />
  <circle cx="306" cy="306" r="4.5" fill="#ffffff" opacity="0.9" />

  <!-- 6. Knowledge Graph Nodes -->

  <!-- Top Satellite Node (Insight / Cloud AI - Violet) -->
  <circle cx="256" cy="92" r="22" fill="#7a4df2" opacity="0.22" filter="url(#softGlow)" />
  <circle cx="256" cy="92" r="14" fill="url(#nodeViolet)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.95" />
  <circle cx="256" cy="92" r="5" fill="#ffffff" />

  <!-- Bottom Satellite Node (Verification / Test - Green) -->
  <circle cx="256" cy="420" r="22" fill="#1c9a5b" opacity="0.22" filter="url(#softGlow)" />
  <circle cx="256" cy="420" r="14" fill="url(#nodeGreen)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.95" />
  <circle cx="256" cy="420" r="5" fill="#ffffff" />

  <!-- Node 1: Bottom-Left (Source Code / AST - Teal) -->
  <circle cx="148" cy="364" r="30" fill="#0a9c99" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="148" cy="364" r="21" fill="url(#nodeTeal)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95" />
  <circle cx="148" cy="364" r="7" fill="#ffffff" />

  <!-- Node 2: Top-Left (Architecture / Class Structure - Blue) -->
  <circle cx="148" cy="148" r="32" fill="#3257f0" opacity="0.28" filter="url(#softGlow)" />
  <circle cx="148" cy="148" r="23" fill="url(#nodeBlue)" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.95" />
  <circle cx="148" cy="148" r="8" fill="#ffffff" />

  <!-- Node 3: Bottom-Right (Flow & Blast Radius / Impact - Magenta) -->
  <circle cx="364" cy="364" r="32" fill="#e23d94" opacity="0.28" filter="url(#softGlow)" />
  <circle cx="364" cy="364" r="23" fill="url(#nodeMagenta)" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.95" />
  <circle cx="364" cy="364" r="8" fill="#ffffff" />

  <!-- Node 4: Top-Right (Knowledge / Report / Overview - Amber) -->
  <circle cx="364" cy="148" r="30" fill="#e0a100" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="364" cy="148" r="21" fill="url(#nodeAmber)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95" />
  <circle cx="364" cy="148" r="7" fill="#ffffff" />

  <!-- Center Node: The "Nexus" Hub (Graph Center - Violet Core Spark) -->
  <circle cx="256" cy="256" r="38" fill="#7a4df2" opacity="0.35" filter="url(#bloomGlow)" />
  <circle cx="256" cy="256" r="26" fill="url(#nodeViolet)" stroke="#ffffff" stroke-width="4" stroke-opacity="1" />
  <circle cx="256" cy="256" r="9" fill="#ffffff" />
  <!-- Center Nexus 4-point star -->
  <path d="M 256 244 Q 256 256 268 256 Q 256 256 256 268 Q 256 256 244 256 Q 256 256 256 244 Z" fill="#ffffff" opacity="0.95" />

  <!-- 7. Glass Rim Highlight on Top Edge -->
  <path d="M 44 140 C 44 86, 86 44, 140 44 L 372 44 C 426 44, 468 86, 468 140 C 468 82, 422 50, 372 50 L 140 50 C 90 50, 44 82, 44 140 Z" fill="#ffffff" opacity="0.12" />
</svg>
