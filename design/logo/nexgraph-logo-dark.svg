<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lockupDarkBg" x1="0" y1="0" x2="840" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141a3e" />
      <stop offset="50%" stop-color="#101432" />
      <stop offset="100%" stop-color="#090c20" />
    </linearGradient>

    <!-- Wordmark Gradient for "Graph" -->
    <linearGradient id="textGraphGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Edge Gradients for mini mark -->
    <linearGradient id="ldNPathGlow" x1="50" y1="145" x2="140" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a9c99" />
      <stop offset="50%" stop-color="#7a4df2" />
      <stop offset="100%" stop-color="#e23d94" />
    </linearGradient>
    <linearGradient id="ldLeftPillar" x1="50" y1="145" x2="50" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a9c99" />
      <stop offset="100%" stop-color="#3257f0" />
    </linearGradient>
    <linearGradient id="ldDiagBridge" x1="50" y1="55" x2="140" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3257f0" />
      <stop offset="50%" stop-color="#7a4df2" />
      <stop offset="100%" stop-color="#e23d94" />
    </linearGradient>
    <linearGradient id="ldRightPillar" x1="140" y1="145" x2="140" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e23d94" />
      <stop offset="100%" stop-color="#e0a100" />
    </linearGradient>

    <!-- Node Radial Gradients -->
    <radialGradient id="ldNodeBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7aa3ff" /><stop offset="100%" stop-color="#1a35a0" />
    </radialGradient>
    <radialGradient id="ldNodeTeal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3fe0dd" /><stop offset="100%" stop-color="#065f5d" />
    </radialGradient>
    <radialGradient id="ldNodeMagenta" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7ebc" /><stop offset="100%" stop-color="#931358" />
    </radialGradient>
    <radialGradient id="ldNodeAmber" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffde59" /><stop offset="100%" stop-color="#8a5e00" />
    </radialGradient>
    <radialGradient id="ldNodeViolet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d4adfc" /><stop offset="100%" stop-color="#4a22aa" />
    </radialGradient>
    <radialGradient id="ldNodeGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4fe391" /><stop offset="100%" stop-color="#0d5731" />
    </radialGradient>

    <filter id="ldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="840" height="220" rx="20" fill="url(#lockupDarkBg)" />
  <rect width="840" height="220" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Ambient glow behind icon -->
  <circle cx="100" cy="110" r="90" fill="#7a4df2" opacity="0.18" />

  <!-- MARK (Scaled and centered at x=100, y=110) -->
  <g transform="translate(5, 10)">
    <!-- Dimensional Roof & Floor -->
    <line x1="50" y1="55" x2="95" y2="30" stroke="#7a4df2" stroke-width="2.5" opacity="0.7" />
    <line x1="95" y1="30" x2="140" y2="55" stroke="#e0a100" stroke-width="2.5" opacity="0.7" />
    <line x1="50" y1="145" x2="95" y2="170" stroke="#1c9a5b" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.7" />
    <line x1="95" y1="170" x2="140" y2="145" stroke="#e23d94" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.7" />

    <!-- Glow Backbone for 'N' -->
    <path d="M 50 145 L 50 55 L 140 145 L 140 55" fill="none" stroke="url(#ldNPathGlow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#ldGlow)" />

    <!-- Solid Stems -->
    <line x1="50" y1="145" x2="50" y2="55" stroke="url(#ldLeftPillar)" stroke-width="6.5" stroke-linecap="round" />
    <line x1="50" y1="55" x2="140" y2="145" stroke="url(#ldDiagBridge)" stroke-width="7.5" stroke-linecap="round" />
    <line x1="140" y1="145" x2="140" y2="55" stroke="url(#ldRightPillar)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Satellites -->
    <circle cx="95" cy="30" r="7" fill="url(#ldNodeViolet)" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="95" cy="170" r="7" fill="url(#ldNodeGreen)" stroke="#ffffff" stroke-width="1.5" />

    <!-- 4 Corner Nodes -->
    <circle cx="50" cy="145" r="10" fill="url(#ldNodeTeal)" stroke="#ffffff" stroke-width="2" />
    <circle cx="50" cy="145" r="3.5" fill="#ffffff" />

    <circle cx="50" cy="55" r="11" fill="url(#ldNodeBlue)" stroke="#ffffff" stroke-width="2" />
    <circle cx="50" cy="55" r="3.5" fill="#ffffff" />

    <circle cx="140" cy="145" r="11" fill="url(#ldNodeMagenta)" stroke="#ffffff" stroke-width="2" />
    <circle cx="140" cy="145" r="3.5" fill="#ffffff" />

    <circle cx="140" cy="55" r="10" fill="url(#ldNodeAmber)" stroke="#ffffff" stroke-width="2" />
    <circle cx="140" cy="55" r="3.5" fill="#ffffff" />

    <!-- Center Nexus Hub -->
    <circle cx="95" cy="100" r="13" fill="url(#ldNodeViolet)" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="95" cy="100" r="4.5" fill="#ffffff" />
  </g>

  <!-- Divider line -->
  <line x1="185" y1="45" x2="185" y2="175" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- LOGOTYPE & TYPOGRAPHY -->
  <g transform="translate(215, 0)">
    <!-- Brand Name "NexGraph" -->
    <text x="0" y="112" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#ffffff">Nex</tspan><tspan fill="url(#textGraphGrad)">Graph</tspan>
    </text>

    <!-- Desktop App Badge / Version Indicator -->
    <rect x="296" y="74" width="76" height="24" rx="12" fill="#7a4df2" fill-opacity="0.22" stroke="#7a4df2" stroke-opacity="0.6" stroke-width="1" />
    <text x="334" y="90" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#c084fc" text-anchor="middle">v0.2.0</text>

    <!-- Tagline (English & Vietnamese options) -->
    <text x="2" y="146" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#a9b3e6" letter-spacing="2.8">
      CONNECTING CODE · REVEALING KNOWLEDGE
    </text>
    <text x="2" y="168" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#6a74a5" letter-spacing="1.2">
      Nền tảng đồ thị tri thức phân tích &amp; khám phá mã nguồn
    </text>
  </g>
</svg>
