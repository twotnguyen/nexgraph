<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <!-- Wordmark Gradient for "Graph" on Light Background -->
    <linearGradient id="lightTextGraphGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Edge Gradients for light mark -->
    <linearGradient id="llLeftPillar" x1="50" y1="145" x2="50" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="llDiagBridge" x1="50" y1="55" x2="140" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="llRightPillar" x1="140" y1="145" x2="140" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Node Radial Gradients -->
    <radialGradient id="llNodeBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" /><stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>
    <radialGradient id="llNodeTeal" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2dd4bf" /><stop offset="100%" stop-color="#0f766e" />
    </radialGradient>
    <radialGradient id="llNodeMagenta" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6" /><stop offset="100%" stop-color="#be185d" />
    </radialGradient>
    <radialGradient id="llNodeAmber" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" /><stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <radialGradient id="llNodeViolet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c084fc" /><stop offset="100%" stop-color="#6d28d9" />
    </radialGradient>
    <radialGradient id="llNodeGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ade80" /><stop offset="100%" stop-color="#15803d" />
    </radialGradient>

    <filter id="llShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean White Base with border -->
  <rect width="840" height="220" rx="20" fill="#ffffff" />
  <rect width="840" height="220" rx="20" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Subtle ambient circle behind mark -->
  <circle cx="100" cy="110" r="85" fill="#f1f5f9" />

  <!-- MARK (Scaled and centered at x=100, y=110) -->
  <g transform="translate(5, 10)" filter="url(#llShadow)">
    <!-- Dimensional Roof & Floor -->
    <line x1="50" y1="55" x2="95" y2="30" stroke="#7c3aed" stroke-width="2.5" opacity="0.6" />
    <line x1="95" y1="30" x2="140" y2="55" stroke="#d97706" stroke-width="2.5" opacity="0.6" />
    <line x1="50" y1="145" x2="95" y2="170" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.6" />
    <line x1="95" y1="170" x2="140" y2="145" stroke="#db2777" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.6" />

    <!-- Solid Stems -->
    <line x1="50" y1="145" x2="50" y2="55" stroke="url(#llLeftPillar)" stroke-width="7" stroke-linecap="round" />
    <line x1="50" y1="55" x2="140" y2="145" stroke="url(#llDiagBridge)" stroke-width="8" stroke-linecap="round" />
    <line x1="140" y1="145" x2="140" y2="55" stroke="url(#llRightPillar)" stroke-width="7" stroke-linecap="round" />

    <!-- Satellites -->
    <circle cx="95" cy="30" r="7.5" fill="url(#llNodeViolet)" stroke="#ffffff" stroke-width="2" />
    <circle cx="95" cy="170" r="7.5" fill="url(#llNodeGreen)" stroke="#ffffff" stroke-width="2" />

    <!-- 4 Corner Nodes -->
    <circle cx="50" cy="145" r="10.5" fill="url(#llNodeTeal)" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="50" cy="145" r="3.5" fill="#ffffff" />

    <circle cx="50" cy="55" r="11.5" fill="url(#llNodeBlue)" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="50" cy="55" r="3.5" fill="#ffffff" />

    <circle cx="140" cy="145" r="11.5" fill="url(#llNodeMagenta)" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="140" cy="145" r="3.5" fill="#ffffff" />

    <circle cx="140" cy="55" r="10.5" fill="url(#llNodeAmber)" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="140" cy="55" r="3.5" fill="#ffffff" />

    <!-- Center Nexus Hub -->
    <circle cx="95" cy="100" r="13.5" fill="url(#llNodeViolet)" stroke="#ffffff" stroke-width="3" />
    <circle cx="95" cy="100" r="4.5" fill="#ffffff" />
  </g>

  <!-- Divider line -->
  <line x1="185" y1="45" x2="185" y2="175" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- LOGOTYPE & TYPOGRAPHY -->
  <g transform="translate(215, 0)">
    <!-- Brand Name "NexGraph" -->
    <text x="0" y="112" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#111827">Nex</tspan><tspan fill="url(#lightTextGraphGrad)">Graph</tspan>
    </text>

    <!-- Desktop App Badge / Version Indicator -->
    <rect x="296" y="74" width="76" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1" />
    <text x="334" y="90" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">v0.2.0</text>

    <!-- Tagline (English & Vietnamese options) -->
    <text x="2" y="146" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#475569" letter-spacing="2.8">
      CONNECTING CODE · REVEALING KNOWLEDGE
    </text>
    <text x="2" y="168" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" letter-spacing="1.2">
      Nền tảng đồ thị tri thức phân tích &amp; khám phá mã nguồn
    </text>
  </g>
</svg>
