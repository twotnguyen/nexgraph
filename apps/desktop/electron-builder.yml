appId: io.github.nexgraph.desktop
productName: NexGraph
# Cập nhật trong app (src/main/app/update): electron-builder sinh `app-update.yml` trong bộ cài
# và `latest.yml` + `.blockmap` cạnh bộ cài Windows. Với provider github chỉ có `latest.yml` cho mọi
# phiên bản (kể cả alpha); bản alpha đã cài thử `alpha.yml` rồi tự lùi về `latest.yml` của Release
# pre-release. Script `package` vẫn `--publish never`; job `release` của CI tải các tệp này lên Release.
# Không khai `publisherName`: bộ cài chưa ký số, khai thì electron-updater sẽ từ chối bản tải về.
publish:
  provider: github
  owner: twotnguyen
  repo: nexgraph
directories:
  output: dist
files:
  - out/**
  - package.json
# Language server và terminal chạy tiến trình con (Node của Electron, spawn-helper của node-pty) nên không được nằm trong app.asar.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/typescript-language-server/**
  - node_modules/typescript/**
  - node_modules/pyright/**
# Engine đã đóng gói bằng PyInstaller (engine/dist/nexgraph-engine) được chép vào resources/engine/.
extraResources:
  - from: ../../engine/dist/nexgraph-engine
    to: engine
  # N1-D1: 3 thư viện của trang đồ thị (vis-network 9.1.6, d3 7.9.2, mermaid 11.17.2) + LICENSE.
  - from: resources/graph-pages
    to: graph-pages
  # P3-8.2: giấy phép phải nằm trong bản cài. Khai trong `files:` với `from` ngoài app dir bị bỏ,
  # nên dùng extraResources → Contents/Resources/ (macOS) hoặc resources/ (Windows) của gói cài.
  - from: ../../THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../LICENSE
    to: LICENSE
# Electron fuses (REV-17): đóng các đường bật lại Node/gỡ lỗi và buộc nạp app từ asar.
# runAsNode giữ bật vì language server và debug adapter chạy bằng chính Node của Electron
# (spawn(process.execPath, …, { ELECTRON_RUN_AS_NODE: '1' })). Tắt nó sẽ làm LSP/debug chết trong bản đóng gói.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  target: dmg
  # Ký ad-hoc cả gói: không có chứng chỉ nhà phát triển nhưng chữ ký hợp lệ, nên macOS cho mở qua
  # Privacy & Security → Open Anyway thay vì báo "bị hỏng". Tắt hardened runtime vì engine PyInstaller nạp thư viện riêng.
  identity: '-'
  hardenedRuntime: false
  category: public.app-category.developer-tools
  # Runtime Nex (OpenCode) do scripts/fetch-nex-runtime.mjs tải về build-resources/opencode/.
  # Chép nguyên binary vào Contents/Resources/opencode/ (ngoài app.asar) đúng vị trí thứ hai mà
  # PR #66 tìm; @electron/osx-sign ký mọi binary trong Contents nên binary được ký ad-hoc cùng app.
  extraResources:
    - from: build-resources/opencode/opencode
      to: opencode/opencode
dmg:
  artifactName: 'NexGraph-${version}-macos-${arch}.${ext}'
win:
  target: nsis
  # Cùng lý do như macOS: binary .exe nằm ngoài asar trong resources/opencode/ (vị trí PR #66 tìm).
  extraResources:
    - from: build-resources/opencode/opencode.exe
      to: opencode/opencode.exe
nsis:
  artifactName: 'NexGraph-${version}-windows-${arch}.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
