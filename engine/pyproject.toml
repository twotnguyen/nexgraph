[project]
name = "nexgraph-engine"
version = "0.1.0"
description = "Engine phân tích mã nguồn của NexGraph"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
nexgraph-engine = "nexgraph_engine.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexgraph_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
