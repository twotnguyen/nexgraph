[project]
name = "nexgraph-engine"
version = "0.2.0a1"
description = "Engine phân tích mã nguồn của NexGraph"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi",
    "uvicorn",
    # Phụ thuộc bắt buộc của mã bên thứ ba đã vendor (xem NOTICE), giữ nguyên ràng buộc phiên bản gốc
    "networkx>=3.4",
    "numpy>=1.21",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",  # 0.9.112: extractor YAML, frontmatter Markdown, manifest
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-rust>=0.23,<0.25",
    "tree-sitter-java>=0.23,<0.25",
    "tree-sitter-groovy>=0.1,<0.3",
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.25",
    "tree-sitter-ruby>=0.23,<0.25",
    "tree-sitter-c-sharp>=0.23,<0.25",
    "tree-sitter-kotlin>=1.0,<2.0",
    "tree-sitter-scala>=0.23,<0.27",
    "tree-sitter-php>=0.23,<0.25",
    "tree-sitter-swift>=0.7,<0.9",
    "tree-sitter-lua>=0.2,<0.6",
    "tree-sitter-zig>=1.0,<2.0",
    "tree-sitter-powershell>=0.26,<0.28",
    "tree-sitter-elixir>=0.3,<0.5",
    "tree-sitter-objc>=3.0,<4.0",
    "tree-sitter-julia>=0.23,<0.25",
    "tree-sitter-verilog>=1.0,<2.0",
    "tree-sitter-fortran>=0.6,<0.8",
    "tree-sitter-bash>=0.23,<0.27",
    "tree-sitter-json>=0.23,<0.26",
    "tree-sitter-dart==0.1.0",
    "pathspec>=1.1.1",
    "mcp>=1.10,<2",
    "starlette>=1.3.1",  # sàn vá CVE như upstream 0.9.112 (MCP HTTP)
    "anyio>=4.14.2",  # sàn vá CVE như upstream 0.9.112
    "matplotlib>=3.11.2",
    "neo4j>=6.4.1",
    "falkordb>=1.8.2",
    "scipy>=1.11",
    "pypdf>=6.21.4",  # sàn của upstream 0.9.112
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "tree-sitter-sql==0.3.11",
    "tree-sitter-hcl>=1.2.0",
    "tree-sitter-pascal>=0.11.0",
    "tree-sitter-ocaml>=0.26.0",
    "tree-sitter-commonlisp>=0.4.1",
    "tree-sitter-dm>=0.25,<0.26",
    "tree-sitter-vb-dotnet==0.3.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "tree-sitter-solidity==1.2.13",
    "tree-sitter-language-pack==0.11.0",
    "robotframework>=4.0",
]

[project.optional-dependencies]
# Chép lời audio/video khi chạy engine từ mã nguồn; không đóng gói vào bản cài (spec F10 §4.5).
media = ["faster-whisper>=1.0"]

[project.scripts]
nexgraph-engine = "nexgraph_engine.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexgraph_engine", "src/graphify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: test chậm (đo đồ thị/vendor) — vẫn chạy trong CI, không skip"]

# Luật phụ thuộc giữa module (ADR 0026, pha 0: chỉ báo cáo). Chạy: `pnpm rules:report` ở gốc repo.
# Tên tầng là package hiện tại; pha 4 gom chúng vào core/storage/indexing/analysis/interfaces.
[tool.importlinter]
root_packages = ["nexgraph_engine", "graphify"]

[[tool.importlinter.contracts]]
id = "engine-layers"
name = "Engine chia tầng: giao diện → điều phối → phân tích → lập chỉ mục → lưu trữ → lõi"
type = "layers"
containers = ["nexgraph_engine"]
layers = [
    "cli : api : mcp : hook_guard : selftest",
    "pipeline",
    "query : arch : flows : impact : changes : prs : semantic : tour : report : memory : global_graph : bridge : export",
    "index : graphify_import : sources : dart : docs",
    "store",
    "schema : ids : errors : logging_setup : subprocesses : text : tasks",
]

[[tool.importlinter.contracts]]
id = "graphify-gateway"
name = "Chỉ nexgraph_engine.adapters.graphify được import graphify"
type = "forbidden"
source_modules = ["nexgraph_engine"]
forbidden_modules = ["graphify"]
ignore_imports = ["nexgraph_engine.adapters.graphify.** -> graphify.**"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "graphify-gateway-core-only"
name = "Cổng adapters.graphify chỉ phụ thuộc tầng lõi"
type = "forbidden"
source_modules = ["nexgraph_engine.adapters"]
forbidden_modules = [
    "nexgraph_engine.cli", "nexgraph_engine.api", "nexgraph_engine.mcp", "nexgraph_engine.hook_guard",
    "nexgraph_engine.selftest", "nexgraph_engine.pipeline",
    "nexgraph_engine.query", "nexgraph_engine.arch", "nexgraph_engine.flows", "nexgraph_engine.impact",
    "nexgraph_engine.changes", "nexgraph_engine.prs", "nexgraph_engine.semantic", "nexgraph_engine.tour",
    "nexgraph_engine.report", "nexgraph_engine.memory", "nexgraph_engine.global_graph", "nexgraph_engine.bridge",
    "nexgraph_engine.export", "nexgraph_engine.index", "nexgraph_engine.graphify_import", "nexgraph_engine.sources",
    "nexgraph_engine.dart", "nexgraph_engine.docs", "nexgraph_engine.store",
]

[[tool.importlinter.contracts]]
id = "graphify-one-way"
name = "Mã vendor graphify không import nexgraph_engine"
type = "forbidden"
source_modules = ["graphify"]
forbidden_modules = ["nexgraph_engine"]
