name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Chỉ huỷ lượt cũ trên PR; trên main mỗi commit đều phải có kết luận CI.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Chỉ các luật đang sạch trên toàn bộ code tự viết: lỗi mới bị chặn, nợ cũ không chặn PR.
      - name: Ruff (engine)
        run: uvx ruff@0.14.0 check --select E9,F63,F7,F82 engine/src/nexgraph_engine engine/tests
      - name: Biome (desktop)
        run: >-
          npx --yes @biomejs/biome@2.3.0 lint --diagnostic-level=error
          --skip=a11y
          --skip=correctness/useExhaustiveDependencies
          --skip=correctness/noVoidTypeReturn
          --skip=suspicious/noAssignInExpressions
          --skip=suspicious/useIterableCallbackReturn
          --skip=suspicious/noShadowRestrictedNames
          --skip=suspicious/noImplicitAnyLet
          --skip=suspicious/noControlCharactersInRegex
          --skip=suspicious/noArrayIndexKey
          --skip=security/noDangerouslySetInnerHtml
          apps/desktop/src

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: engine
      - run: uv run --locked pytest tests -q
        working-directory: engine

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm run setup:dev
      - name: Smoke test checkout sạch
        shell: bash
        timeout-minutes: 5
        env:
          NEXGRAPH_SMOKE: '1'
          NEXGRAPH_USER_DATA_DIR: ${{ runner.temp }}/nexgraph-dev-profile
          NEXGRAPH_DATA_DIR: ${{ runner.temp }}/nexgraph-dev-engine
        run: |
          pnpm dev 2>&1 | tee nexgraph-dev-smoke.log
          grep -F 'SMOKE OK nodes=' nexgraph-dev-smoke.log
      - run: pnpm --filter @nexgraph/desktop typecheck
      - run: pnpm --filter @nexgraph/desktop test
        env:
          NEXGRAPH_E2E: '1'
      - run: pnpm --filter ./apps/extension typecheck
      - run: pnpm --filter ./apps/extension test

  package:
    name: package (${{ matrix.os }})
    # Chờ test: bản cài chỉ được dựng và tải lên khi engine/desktop đã xanh.
    needs: [engine, desktop]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Tag phải khớp version của app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./apps/desktop/package.json').version")"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Đóng gói engine (PyInstaller)
        run: |
          uv sync --locked
          uv run --locked pyinstaller packaging/nexgraph-engine.spec --noconfirm
        working-directory: engine
      - run: pnpm install --frozen-lockfile
      - name: Đóng gói ứng dụng (electron-builder)
        run: pnpm --filter @nexgraph/desktop run package
      - name: Kiểm tra tệp cài đặt
        id: installer
        run: node apps/desktop/scripts/check-installer.mjs
      - name: Cài và smoke test bộ cài
        shell: bash
        timeout-minutes: 8
        env:
          NEXGRAPH_INSTALLER: ${{ steps.installer.outputs.path }}
        run: node apps/desktop/scripts/smoke-packaged.mjs --installer "$NEXGRAPH_INSTALLER" --disable-webgl
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.name }}
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.manifest }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine, desktop, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Chạy lại job sau khi release đã tạo dở thì chỉ tải đè tệp.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "NexGraph $GITHUB_REF_NAME" --generate-notes
          fi
