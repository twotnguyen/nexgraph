name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  # CI-01: trên main mỗi commit là một group riêng, nên merge liên tiếp không thay thế run đang chờ
  # và mỗi commit trên main đều có kết luận CI. Nhánh PR/tag giữ một group theo ref để run mới huỷ run cũ.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # CI-02: chọn phần việc nặng cần chạy theo tệp đổi của PR (tools/ci/changes.mjs, luật và lý do ở đầu tệp).
  # Push lên main/tag luôn chạy đủ (`--all`), nên thứ lọt bộ lọc của PR vẫn bị bắt trên commit merge.
  # Job bắt buộc KHÔNG bị bỏ (8 check của `main-guard` phải luôn có kết quả); chỉ các bước nặng có `if`.
  # Lỗi lấy danh sách tệp hoặc PR > 3000 tệp (giới hạn API) đều rơi về chạy đủ.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      engine: ${{ steps.pick.outputs.engine }}
      desktop: ${{ steps.pick.outputs.desktop }}
      package: ${{ steps.pick.outputs.package }}
      labs: ${{ steps.pick.outputs.labs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tools/ci
      - name: Danh sách tệp đổi của PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          gh api "repos/$REPO/pulls/$PR/files" --paginate
          --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          || rm -f "$RUNNER_TEMP/changed.txt"
      - name: Chọn phần CI cần chạy
        id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          list="$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ] && [ -s "$list" ] && [ "$(wc -l < "$list")" -lt 3000 ]; then
            node tools/ci/changes.mjs --files "$list"
          else
            node tools/ci/changes.mjs --all
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # Chỉ các luật đang sạch trên toàn bộ code tự viết: lỗi mới bị chặn, nợ cũ không chặn PR.
      - name: Ruff (engine)
        run: uvx ruff@0.14.0 check --select E9,F63,F7,F82 engine/src/nexgraph_engine engine/tests
      - name: Biome (desktop)
        run: >-
          npx --yes @biomejs/biome@2.3.0 lint --diagnostic-level=error
          --skip=a11y
          --skip=correctness/useExhaustiveDependencies
          --skip=correctness/noVoidTypeReturn
          --skip=suspicious/noAssignInExpressions
          --skip=suspicious/useIterableCallbackReturn
          --skip=suspicious/noShadowRestrictedNames
          --skip=suspicious/noImplicitAnyLet
          --skip=suspicious/noControlCharactersInRegex
          --skip=suspicious/noArrayIndexKey
          --skip=security/noDangerouslySetInnerHtml
          apps/desktop/src

  # Luật phụ thuộc giữa module (ADR 0026 pha 4e): check bắt buộc thứ 8 của ruleset `main-guard`.
  # `rules:strict` thoát 1 khi còn bất kỳ vi phạm (kể cả cảnh báo vòng phụ thuộc); summary của job vẫn có bảng chi tiết.
  module-rules:
    name: module-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # dependency-cruiser cần TypeScript của dự án; không chạy script cài đặt (không cần Electron).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rules:strict

  # Nhánh thử nghiệm Code-OSS (labs/, ADR 0026 pha 1): ngoài pnpm workspace mặc định, lockfile riêng.
  # Không thuộc 8 check bắt buộc, `release` không chờ; vẫn chạy để thấy ngay khi việc chuyển tệp desktop làm gãy labs.
  labs:
    name: labs (báo cáo)
    needs: changes
    if: needs.changes.outputs.labs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # extension import thẳng mã desktop nên cần node_modules của desktop; không cần Electron.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir labs/extension install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir labs/extension typecheck
      - run: pnpm --dir labs/extension test

  engine:
    name: engine (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # CI-02: runner Windows là máy tạm; quét thời gian thực của Defender làm chậm thao tác nhiều tệp
      # (pytest, git trong test, electron-builder) và là nguồn test hết giờ chập chờn. Không tắt được thì chạy tiếp.
      - name: Tắt quét thời gian thực của Defender
        if: runner.os == 'Windows' && needs.changes.outputs.engine != 'skip'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.engine != 'skip'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: needs.changes.outputs.engine != 'skip'
        with:
          enable-cache: true
      - run: uv sync --locked
        if: needs.changes.outputs.engine != 'skip'
        working-directory: engine
      # CI-02: pytest-xdist, mỗi lõi một worker (122 s → 20 s trên máy 12 lõi; macOS CI 4m37 → 2m35).
      # TEMP/TMP về runner.temp: trên Windows là ổ D: của runner, thư mục tạm mặc định nằm ở ổ C: chậm.
      # --durations in 20 test chậm nhất để biết chỗ cần tối ưu tiếp.
      - run: uv run --locked pytest tests -q -n auto --durations=20
        if: needs.changes.outputs.engine == 'full'
        working-directory: engine
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      # PR chỉ đổi tài liệu: chỉ nhóm test đọc *.md của repo (che secret không được dương tính giả).
      - run: uv run --locked pytest tests/indexing/test_docs_secrets.py -q
        if: needs.changes.outputs.engine == 'docs'
        working-directory: engine
      - name: Không có tệp ảnh hưởng engine
        if: needs.changes.outputs.engine == 'skip'
        run: echo "PR không đổi tệp nào mà test engine đọc; push lên main vẫn chạy đủ."

  desktop:
    name: desktop (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # CI-02: runner Windows là máy tạm; quét thời gian thực của Defender làm chậm thao tác nhiều tệp
      # (pytest, git trong test, electron-builder) và là nguồn test hết giờ chập chờn. Không tắt được thì chạy tiếp.
      - name: Tắt quét thời gian thực của Defender
        if: runner.os == 'Windows' && needs.changes.outputs.desktop == 'true'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.desktop == 'true'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: needs.changes.outputs.desktop == 'true'
        with:
          enable-cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: needs.changes.outputs.desktop == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm run setup:dev
        if: needs.changes.outputs.desktop == 'true'
      - name: Smoke test checkout sạch
        if: needs.changes.outputs.desktop == 'true'
        shell: bash
        timeout-minutes: 5
        env:
          NEXGRAPH_SMOKE: '1'
          NEXGRAPH_USER_DATA_DIR: ${{ runner.temp }}/nexgraph-dev-profile
          NEXGRAPH_DATA_DIR: ${{ runner.temp }}/nexgraph-dev-engine
        run: |
          pnpm dev 2>&1 | tee nexgraph-dev-smoke.log
          grep -F 'SMOKE OK nodes=' nexgraph-dev-smoke.log
      - run: pnpm --filter @nexgraph/desktop typecheck
        if: needs.changes.outputs.desktop == 'true'
      - run: pnpm --filter @nexgraph/desktop test
        if: needs.changes.outputs.desktop == 'true'
        env:
          NEXGRAPH_E2E: '1'
          # Test git/E2E tạo nhiều repo tạm: để trên ổ D: của runner Windows như engine (CI-02).
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Không có tệp ảnh hưởng desktop
        if: needs.changes.outputs.desktop != 'true'
        run: echo "PR không đổi tệp nào mà test desktop đọc; push lên main vẫn chạy đủ."

  version-check:
    name: version-check
    # REL-07: chỉ chạy khi push tag v* — tag phải khớp cả 4 nguồn version trước khi build/release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag phải khớp version ở 4 nguồn
        run: node tools/ci/check-version.mjs "$GITHUB_REF_NAME"

  package:
    name: package (${{ matrix.os }})
    # Chạy SONG SONG với engine/desktop (CI-1): đường găng = max(test, package) thay vì test + package.
    # Phát hành vẫn an toàn: job `release` chờ đủ version-check, engine, desktop và package
    # (khoá bằng engine/tests/repo/test_ci_workflow.py). Bản cài của PR đỏ test chỉ là artifact, không phát hành.
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # CI-02: runner Windows là máy tạm; quét thời gian thực của Defender làm chậm thao tác nhiều tệp
      # (pytest, git trong test, electron-builder) và là nguồn test hết giờ chập chờn. Không tắt được thì chạy tiếp.
      - name: Tắt quét thời gian thực của Defender
        if: runner.os == 'Windows' && needs.changes.outputs.package == 'true'
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.package == 'true'
      - name: Tag phải khớp version ở 4 nguồn
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node tools/ci/check-version.mjs "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: needs.changes.outputs.package == 'true'
        with:
          enable-cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: needs.changes.outputs.package == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.package == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Đóng gói engine (PyInstaller)
        if: needs.changes.outputs.package == 'true'
        run: |
          uv sync --locked
          uv run --locked pyinstaller packaging/nexgraph-engine.spec --noconfirm
        working-directory: engine
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.package == 'true'
      # PKG-NEX-3: runtime Nex tải theo tệp ghim (sha256 trong nex-runtime.json). Cache theo hash tệp ghim
      # để PR sau không tải lại 110–126 MB; fetch vẫn kiểm sha nên cache hỏng sẽ tự tải lại.
      - name: Cache runtime Nex (theo sha256 trong tệp ghim)
        if: needs.changes.outputs.package == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/desktop/build-resources/opencode
          key: nex-runtime-${{ runner.os }}-${{ hashFiles('apps/desktop/nex-runtime.json') }}
      - name: Tải runtime Nex (kiểm sha256)
        if: needs.changes.outputs.package == 'true'
        run: node apps/desktop/scripts/fetch-nex-runtime.mjs
      - name: Đóng gói ứng dụng (electron-builder)
        if: needs.changes.outputs.package == 'true'
        run: pnpm --filter @nexgraph/desktop run package
      - name: Kiểm tra tệp cài đặt
        if: needs.changes.outputs.package == 'true'
        id: installer
        run: node apps/desktop/scripts/check-installer.mjs
      - name: Cài và smoke test bộ cài
        if: needs.changes.outputs.package == 'true'
        shell: bash
        timeout-minutes: 8
        env:
          NEXGRAPH_INSTALLER: ${{ steps.installer.outputs.path }}
        run: node apps/desktop/scripts/smoke-packaged.mjs --installer "$NEXGRAPH_INSTALLER" --disable-webgl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.changes.outputs.package == 'true'
        with:
          name: ${{ steps.installer.outputs.name }}
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.manifest }}
          if-no-files-found: error
      - name: Không có tệp ảnh hưởng bộ cài
        if: needs.changes.outputs.package != 'true'
        run: echo "PR chỉ đổi tài liệu, test hoặc renderer; push lên main vẫn đóng gói và smoke bộ cài."

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    # REL-06: release chỉ chạy khi version-check xanh (tag khớp cả 4 nguồn version).
    needs: [version-check, engine, desktop, package, module-rules]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # REL-06: tag có dấu `-` (0.2.0-alpha.1, -beta.N, -rc.N) -> Release ở chế độ prerelease.
        # Chạy lại job sau khi release đã tạo dở thì chỉ tải đè tệp.
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [ "${#prerelease[@]}" -gt 0 ]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "NexGraph $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          fi
