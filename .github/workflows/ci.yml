name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  # CI-01: trên main mỗi commit là một group riêng, nên merge liên tiếp không thay thế run đang chờ
  # và mỗi commit trên main đều có kết luận CI. Nhánh PR/tag giữ một group theo ref để run mới huỷ run cũ.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # Chỉ các luật đang sạch trên toàn bộ code tự viết: lỗi mới bị chặn, nợ cũ không chặn PR.
      - name: Ruff (engine)
        run: uvx ruff@0.14.0 check --select E9,F63,F7,F82 engine/src/nexgraph_engine engine/tests
      - name: Biome (desktop)
        run: >-
          npx --yes @biomejs/biome@2.3.0 lint --diagnostic-level=error
          --skip=a11y
          --skip=correctness/useExhaustiveDependencies
          --skip=correctness/noVoidTypeReturn
          --skip=suspicious/noAssignInExpressions
          --skip=suspicious/useIterableCallbackReturn
          --skip=suspicious/noShadowRestrictedNames
          --skip=suspicious/noImplicitAnyLet
          --skip=suspicious/noControlCharactersInRegex
          --skip=suspicious/noArrayIndexKey
          --skip=security/noDangerouslySetInnerHtml
          apps/desktop/src

  # Luật phụ thuộc giữa module (ADR 0026). Pha 0: chỉ báo cáo vào summary của job, không thuộc 7 check bắt buộc.
  # Pha 4 đổi sang `pnpm rules:strict` và đưa vào ruleset.
  module-rules:
    name: module-rules (báo cáo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # dependency-cruiser cần TypeScript của dự án; không chạy script cài đặt (không cần Electron).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rules:report

  # Nhánh thử nghiệm Code-OSS (labs/, ADR 0026 pha 1): ngoài pnpm workspace mặc định, lockfile riêng.
  # Không thuộc 7 check bắt buộc, `release` không chờ; vẫn chạy để thấy ngay khi việc chuyển tệp desktop làm gãy labs.
  labs:
    name: labs (báo cáo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # extension import thẳng mã desktop nên cần node_modules của desktop; không cần Electron.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir labs/extension install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir labs/extension typecheck
      - run: pnpm --dir labs/extension test

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: engine
      - run: uv run --locked pytest tests -q
        working-directory: engine

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm run setup:dev
      - name: Smoke test checkout sạch
        shell: bash
        timeout-minutes: 5
        env:
          NEXGRAPH_SMOKE: '1'
          NEXGRAPH_USER_DATA_DIR: ${{ runner.temp }}/nexgraph-dev-profile
          NEXGRAPH_DATA_DIR: ${{ runner.temp }}/nexgraph-dev-engine
        run: |
          pnpm dev 2>&1 | tee nexgraph-dev-smoke.log
          grep -F 'SMOKE OK nodes=' nexgraph-dev-smoke.log
      - run: pnpm --filter @nexgraph/desktop typecheck
      - run: pnpm --filter @nexgraph/desktop test
        env:
          NEXGRAPH_E2E: '1'

  version-check:
    name: version-check
    # REL-07: chỉ chạy khi push tag v* — tag phải khớp cả 4 nguồn version trước khi build/release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag phải khớp version ở 4 nguồn
        run: node tools/ci/check-version.mjs "$GITHUB_REF_NAME"

  package:
    name: package (${{ matrix.os }})
    # Chạy SONG SONG với engine/desktop (CI-1): đường găng = max(test, package) thay vì test + package.
    # Phát hành vẫn an toàn: job `release` chờ đủ version-check, engine, desktop và package
    # (khoá bằng engine/tests/test_ci_workflow.py). Bản cài của PR đỏ test chỉ là artifact, không phát hành.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag phải khớp version ở 4 nguồn
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node tools/ci/check-version.mjs "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Đóng gói engine (PyInstaller)
        run: |
          uv sync --locked
          uv run --locked pyinstaller packaging/nexgraph-engine.spec --noconfirm
        working-directory: engine
      - run: pnpm install --frozen-lockfile
      # PKG-NEX-3: runtime Nex tải theo tệp ghim (sha256 trong nex-runtime.json). Cache theo hash tệp ghim
      # để PR sau không tải lại 110–126 MB; fetch vẫn kiểm sha nên cache hỏng sẽ tự tải lại.
      - name: Cache runtime Nex (theo sha256 trong tệp ghim)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/desktop/build-resources/opencode
          key: nex-runtime-${{ runner.os }}-${{ hashFiles('apps/desktop/nex-runtime.json') }}
      - name: Tải runtime Nex (kiểm sha256)
        run: node apps/desktop/scripts/fetch-nex-runtime.mjs
      - name: Đóng gói ứng dụng (electron-builder)
        run: pnpm --filter @nexgraph/desktop run package
      - name: Kiểm tra tệp cài đặt
        id: installer
        run: node apps/desktop/scripts/check-installer.mjs
      - name: Cài và smoke test bộ cài
        shell: bash
        timeout-minutes: 8
        env:
          NEXGRAPH_INSTALLER: ${{ steps.installer.outputs.path }}
        run: node apps/desktop/scripts/smoke-packaged.mjs --installer "$NEXGRAPH_INSTALLER" --disable-webgl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.installer.outputs.name }}
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.manifest }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    # REL-06: release chỉ chạy khi version-check xanh (tag khớp cả 4 nguồn version).
    needs: [version-check, engine, desktop, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # REL-06: tag có dấu `-` (0.2.0-alpha.1, -beta.N, -rc.N) -> Release ở chế độ prerelease.
        # Chạy lại job sau khi release đã tạo dở thì chỉ tải đè tệp.
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [ "${#prerelease[@]}" -gt 0 ]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "NexGraph $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          fi
